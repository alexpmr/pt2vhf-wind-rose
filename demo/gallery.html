<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="same-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Rose gallery</title>
<style>
  /* Renders one README image per ?set=… (pointers, heat, grid, sizes) with the simulated hass below. */
  body { margin: 0; padding: 14px; background: #111; display: flex; gap: 12px; align-items: flex-start;
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: #ffffff1f; --card-background-color: #1c1c1c;
    font-family: Roboto, system-ui, sans-serif; }
  body.light { background: #f3f3f3; --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: #0000001f; --card-background-color: #fff; }
  figure { margin: 0; color: var(--secondary-text-color); font: 13px/1.3 Roboto, system-ui, sans-serif; }
  figcaption { margin-top: 2px; text-align: center; }
  figcaption code { color: var(--primary-text-color); font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<script type="module">
  import '../pt2vhf-wind-rose-card.js';
  const set = new URLSearchParams(location.search).get('set') || 'pointers';
  const now = Date.now() / 1000;
  const sp = [], dr = [];
  let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let t = now - 3600; t < now; t += 20) {
    const r = rnd();
    const d = r < 0.6 ? 320 + (rnd() - 0.5) * 50 : r < 0.85 ? 20 + (rnd() - 0.5) * 30 : 250 + (rnd() - 0.5) * 30;
    sp.push({ s: String(r < 0.6 ? 2 + rnd() * 7 : 1 + rnd() * 4), lu: t });
    dr.push({ s: String((d + 360) % 360), lu: t });
  }
  const hass = (lang) => ({
    language: lang, locale: { language: lang }, config: { latitude: -23.5093, longitude: -46.6378 },
    states: {
      'sensor.wind_speed': { state: '4.2', attributes: { unit_of_measurement: 'km/h' } },
      'sensor.wind_direction': { state: '318', attributes: {} },
      'sensor.wind_gust': { state: '7.5', attributes: { unit_of_measurement: 'km/h' } },
      'binary_sensor.rain': { state: 'off', attributes: {} },
    },
    callWS: async () => ({ 'sensor.wind_speed': sp, 'sensor.wind_direction': dr }),
  });
  const base = { entity: 'sensor.wind_speed', direction_entity: 'sensor.wind_direction', gust_entity: 'sensor.wind_gust', name: 'Wind' };
  const sets = {
    pointers: ['arrow', 'chevron', 'dart', 'needle', 'compass', 'vane', 'none']
      .map((p) => [`pointer: ${p}`, { pointer: p }]),
    heat: [
      ['heat_mode: plume', {}],
      ['plume_width: 25', { plume_width: 25 }],
      ['plume_fade: 0', { plume_fade: 0 }],
      ['heat_mode: spots', { heat_mode: 'spots' }],
      ['heat_direction: to', { heat_direction: 'to' }],
    ],
    // heat_motion: sways with the speed, flickers with the gusts (demo gust = 7.5 vs speed 4.2).
    motion: [
      ['heat_motion: false', {}],
      ['heat_motion: true', { heat_motion: true }],
      ['true + heat_direction: to', { heat_motion: true, heat_direction: 'to' }],
      ['heat_fire: true, to', { heat_fire: true, heat_direction: 'to', plume_width: 18, plume_fade: 24, direction_offset: 45, show_rings: false, show_spokes: false }],
      ['heat_fire + heat_motion, to', { heat_fire: true, heat_motion: true, heat_direction: 'to', plume_width: 18, plume_fade: 24, direction_offset: 45, show_rings: false, show_spokes: false }],
    ],
    // heat_fire on its own, large, with a common heat_direction: to setup.
    fire: [
      ['heat_fire: true', { heat_fire: true, heat_motion: true, heat_direction: 'to', plume_width: 18, plume_fade: 24, direction_offset: 45, show_rings: false, show_spokes: false, show_speed: false, show_gust: false }, 420],
    ],
    grid: [
      ['default grid', {}],
      ['rings + spokes off', { show_rings: false, show_spokes: false }],
      ['rim, rings, spokes off', { show_rim: false, show_rings: false, show_spokes: false, show_scale: false }],
      ['direction_offset: 45', { direction_offset: 45 }],
      ["pointer_color: '#e8553e'", { pointer: 'needle', pointer_color: '#e8553e' }],
    ],
    // 2×2 square for social posts.
    social: [
      ['plume + arrow', {}, 290],
      ["vane, '#e8553e'", { pointer: 'vane', pointer_color: '#e8553e', show_rings: false, show_spokes: false }, 290],
      ['needle, rotated 45°', { pointer: 'needle', direction_offset: 45, show_spokes: false }, 290],
      ['minimal: dart, no grid', { pointer: 'dart', show_rim: false, show_rings: false, show_spokes: false, show_scale: false }, 290],
    ],
    // Background maps and runway (demo location: Campo de Marte airport, São Paulo, runway 12/30).
    map: [
      ['map: satellite + runway', { map: 'satellite', map_radius: 900, heat_opacity: 70, runway_heading: 99, runway_name: '12/30', pointer: 'dart', show_rings: false, show_spokes: false }, 290],
      ['map: streets', { map: 'streets', map_radius: 900, heat_opacity: 70, show_rings: false }, 290],
      ['map: dark + runway', { map: 'dark', map_radius: 900, heat_opacity: 75, runway_heading: 99, runway_name: '12/30', pointer: 'needle' }, 290],
      ['runway only', { runway_heading: 99, runway_name: '12/30', show_spokes: false }, 290],
    ],
    // Aerodrome runways by ICAO code (OurAirports data), drawn at their real place and size.
    icao: [
      ['icao: SBGR (all runways)', { map: 'satellite', icao: 'SBGR', map_radius: 2200, heat_opacity: 70, show_rings: false, show_spokes: false, pointer: 'dart' }, 290],
      ['icao: SBGR, runways: [10L/28R]', { map: 'satellite', icao: 'SBGR', runways: ['10L/28R'], map_radius: 2200, heat_opacity: 70, show_rings: false, show_spokes: false, pointer: 'dart' }, 290],
    ],
    sizes: [[165, 'narrow column'], [300, 'half width'], [420, 'full width']]
      .map(([w, l]) => [`${l} (${w} px)`, {}, w]),
  };
  if (new URLSearchParams(location.search).get('theme') === 'light') document.body.classList.add('light');
  if (['social', 'map', 'icao'].includes(set)) Object.assign(document.body.style, { flexWrap: 'wrap', width: '604px', gap: '10px 14px' });
  for (const [label, cfg, w] of sets[set]) {
    const f = document.createElement('figure');
    f.style.width = `${w ?? 200}px`;
    const c = document.createElement('pt2vhf-wind-rose-card');
    c.setConfig({ ...base, ...cfg });
    c.hass = hass('en');
    const cap = document.createElement('figcaption');
    const code = document.createElement('code');
    code.textContent = label;
    cap.append(code);
    f.append(c, cap);
    document.body.append(f);
  }
</script>
</body>
</html>
