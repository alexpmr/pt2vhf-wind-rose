<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Rose demo</title>
<style>
  body { margin: 0; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 400px)); gap: 16px; font-family: Roboto, system-ui, sans-serif; }
  .dark { --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: #ffffff1f; --card-background-color: #1c1c1c; background: #111; padding: 16px; }
  .light { --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: #0000001f; --card-background-color: #fff; background: #f3f3f3; padding: 16px; }
  ha-card { display: block; background: var(--card-background-color); border-radius: 12px; border: 1px solid var(--divider-color); }
</style>
</head>
<body>
<div class="dark" id="d"></div>
<div class="light" id="l"></div>
<script type="module">
  import '../pt2vhf-wind-rose-card.js';
  // Simulated last hour: mostly NNW 2–6 km/h with some NW gusts and a calm spell.
  const now = Date.now() / 1000;
  const sp = [], dr = [];
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let t = now - 3600; t < now; t += 30) {
    const calm = t > now - 1500 && t < now - 1200;
    sp.push({ s: String(calm ? 0.2 : 2 + rnd() * 4 + (rnd() > 0.9 ? 5 : 0)), lu: t });
    dr.push({ s: String((330 + (rnd() - 0.5) * 60 + (rnd() > 0.8 ? -40 : 0) + 360) % 360), lu: t });
  }
  const mk = (lang) => ({
    language: lang, locale: { language: lang },
    states: {
      'sensor.wind_speed': { state: '3', attributes: { unit_of_measurement: 'km/h', device_class: 'wind_speed' } },
      'sensor.wind_direction': { state: '339', attributes: { unit_of_measurement: '°' } },
      'sensor.wind_gust': { state: '4', attributes: { unit_of_measurement: 'km/h' } },
      'binary_sensor.is_raining': { state: lang === 'pt-BR' ? 'on' : 'off', attributes: {} },
    },
    callWS: async () => ({ 'sensor.wind_speed': sp, 'sensor.wind_direction': dr }),
  });
  for (const [id, lang] of [['d', 'pt-BR'], ['l', 'en']]) {
    const c = document.createElement('pt2vhf-wind-rose-card');
    c.setConfig({ entity: 'sensor.wind_speed', direction_entity: 'sensor.wind_direction', gust_entity: 'sensor.wind_gust', rain_entity: 'binary_sensor.is_raining', name: 'Vento' });
    c.hass = mk(lang);
    document.getElementById(id).append(c);
  }
  window.actions = [];
  window.addEventListener('hass-action', (e) => window.actions.push(e.detail));
</script>
</body>
</html>
